<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCEANIC ORDER - Standings</title>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon">⛵</span>
                OCEANIC ORDER
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Live Race</a>
                </li>
                <li class="nav-item">
                    <a href="standings.html" class="nav-link active">Standings</a>
                </li>
                <li class="nav-item">
                    <a href="history.html" class="nav-link">History</a>
                </li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1>Race Standings</h1>
            <div class="filter-controls">
                <label for="race-select">Select Race:</label>
                <select id="race-select" class="race-dropdown">
                    <option>Loading races...</option>
                </select>
            </div>
        </div>

        <!-- Standings Table -->
        <div class="card standings-card">
            <table class="standings-table">
                <thead>
                    <tr>
                        <th class="col-position">Position</th>
                        <th class="col-boat">Boat Name</th>
                        <th class="col-number">Boat Number</th>
                        <th class="col-team">Team</th>
                        <th class="col-time">Finish Time</th>
                        <th class="col-distance">Distance (m)</th>
                        <th class="col-avg-speed">Avg Speed (knots)</th>
                    </tr>
                </thead>
                <tbody id="standings-body">
                    <tr>
                        <td colspan="7" class="loading">Loading standings...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Stats Section -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Races</h3>
                <p id="total-races" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>Active Boats</h3>
                <p id="active-boats-count" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>Avg Race Duration</h3>
                <p id="avg-duration" class="stat-value">--:--</p>
            </div>
            <div class="stat-card">
                <h3>Leader Speed</h3>
                <p id="leader-speed" class="stat-value">-- knots</p>
            </div>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="spinner">
        <div class="spinner-circle"></div>
    </div>

    <!-- Error Toast -->
    <div id="error-toast" class="toast toast-error"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/standings.js"></script>
</body>
</html>
