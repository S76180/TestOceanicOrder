<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCEANIC ORDER — Race History</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Leaflet for replay map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/history.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content">
    <div class="page-container">
      <!-- Header -->
      <section class="section-header slide-up">
        <div>
          <h1 class="section-title">Race History</h1>
          <p class="section-subtitle">Browse and replay past races</p>
        </div>
        <div class="history-filters">
          <select class="filter-select" id="filterStatus">
            <option value="all">All Races</option>
            <option value="completed">Completed</option>
            <option value="upcoming">Upcoming</option>
            <option value="live">Live</option>
          </select>
          <select class="filter-select" id="filterSort">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
      </section>

      <!-- Race Cards Grid -->
      <section class="race-cards-grid" id="raceCardsGrid">
        <div class="loading-spinner"></div>
      </section>

      <!-- Race Detail Modal -->
      <div class="modal-overlay" id="raceDetailModal">
        <div class="modal" style="max-width: 900px;">
          <div class="modal-header">
            <h3 class="modal-title" id="modalRaceName">Race Details</h3>
            <button class="modal-close" id="modalClose">✕</button>
          </div>
          <div id="modalContent">
            <div class="loading-spinner"></div>
          </div>
        </div>
      </div>

      <!-- Race Replay Section -->
      <section class="replay-section mt-3 mb-3" id="replaySection" style="display:none;">
        <div class="section-header">
          <div>
            <h2 class="section-title">Race Replay</h2>
            <p class="section-subtitle" id="replayRaceName">—</p>
          </div>
          <button class="btn btn-secondary btn-sm" id="closeReplay">Close Replay</button>
        </div>
        <div class="card replay-card">
          <div class="replay-map-container">
            <div id="replayMap" style="height: 450px;"></div>
          </div>
          <div class="replay-controls">
            <button class="btn btn-primary btn-sm" id="replayPlayBtn">▶ Play</button>
            <input type="range" class="replay-slider" id="replaySlider" min="0" max="100" value="0">
            <span class="replay-time" id="replayTimeLabel">00:00</span>
            <select class="filter-select" id="replaySpeed">
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="5">5x</option>
              <option value="10">10x</option>
            </select>
          </div>
          <!-- Results table -->
          <div class="replay-results mt-2" id="replayResults"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
