<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCEANIC ORDER — Live Race</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛵</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/live-race.css">
</head>
<body>
  <div id="navbar-container"></div>

  <main class="main-content live-race-layout">
    <!-- Sidebar Panel -->
    <aside class="race-sidebar" id="raceSidebar">
      <div class="sidebar-header">
        <div>
          <h2 class="sidebar-title">Live Tracking</h2>
          <p class="sidebar-subtitle" id="raceNameLabel">Loading race...</p>
        </div>
        <span class="badge badge-live" id="raceBadge">Live</span>
      </div>

      <!-- Race Info -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">Race Info</div>
        <div class="race-meta-grid" id="raceMetaGrid">
          <div class="meta-item">
            <span class="meta-label">Elapsed</span>
            <span class="meta-value" id="sidebarElapsed">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Distance</span>
            <span class="meta-value" id="sidebarDistance">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Wind</span>
            <span class="meta-value" id="sidebarWind">—</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Course</span>
            <span class="meta-value" id="sidebarCourse">—</span>
          </div>
        </div>
      </div>

      <!-- Boat List -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">
          Boats
          <button class="btn-icon btn-sm" id="toggleAllTracks" title="Toggle all tracks">👁</button>
        </div>
        <div class="boat-list" id="boatList">
          <div class="loading-spinner"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="sidebar-controls">
        <button class="btn btn-primary btn-sm" id="btnCenterMap" title="Center map on fleet">📍 Center Fleet</button>
        <button class="btn btn-secondary btn-sm" id="btnToggleTracks" title="Show/hide tracks">🔀 Toggle Tracks</button>
        <button class="btn btn-secondary btn-sm" id="btnSimulate" title="Toggle simulation">▶ Simulate</button>
      </div>
    </aside>

    <!-- Map Area -->
    <div class="map-container">
      <div id="map"></div>
      <!-- Map overlay info -->
      <div class="map-overlay-top">
        <div class="overlay-chip" id="overlayTime">
          <span class="overlay-label">Time</span>
          <span class="overlay-value" id="overlayTimeValue">—</span>
        </div>
        <div class="overlay-chip" id="overlayBoatCount">
          <span class="overlay-label">Boats</span>
          <span class="overlay-value" id="overlayBoatCountValue">—</span>
        </div>
      </div>
      <!-- Selected boat info popup -->
      <div class="map-boat-info" id="mapBoatInfo" style="display:none;">
        <button class="map-boat-info-close" id="closeBoatInfo">✕</button>
        <div id="boatInfoContent"></div>
      </div>
    </div>

    <!-- Mobile toggle button -->
    <button class="sidebar-toggle-mobile" id="sidebarToggleMobile">☰</button>
  </main>

  <div id="footer-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/live-race.js"></script>
</body>
</html>
